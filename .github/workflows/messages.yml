name: Messages
run-name: "${{ inputs.message && format('msg ({0}): {1}', inputs.source || 'telegram', inputs.message) || 'telegram poll' }}"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      message:
        description: Message to process
        required: false
        type: string
      source:
        description: Message source
        required: false
        default: telegram
        type: string

permissions:
  contents: write
  actions: write

jobs:
  poll:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.message == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Poll Telegram
        env:
          GH_TOKEN: ${{ secrets.GH_GLOBAL || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram polling not configured."
            exit 0
          fi

          webhook_url="$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | jq -r '.result.url // empty')"
          if [ -n "$webhook_url" ]; then
            echo "Telegram webhook active; polling skipped."
            exit 0
          fi

          response="$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0&allowed_updates=%5B%22message%22,%22callback_query%22%5D")"
          count="$(echo "$response" | jq '.result | length')"
          max_update_id=""
          messages='[]'
          callbacks='[]'

          for ((i=0; i<count; i++)); do
            update_id="$(echo "$response" | jq -r ".result[$i].update_id // empty")"
            if [ -n "$update_id" ]; then max_update_id="$update_id"; fi

            text="$(echo "$response" | jq -r ".result[$i].message.text // empty")"
            chat="$(echo "$response" | jq -r ".result[$i].message.chat.id // empty")"
            if [ -n "$text" ] && [ "$chat" = "$TELEGRAM_CHAT_ID" ]; then
              messages="$(echo "$messages" | jq --arg text "$text" '. + [$text]')"
            fi

            callback_id="$(echo "$response" | jq -r ".result[$i].callback_query.id // empty")"
            callback_data="$(echo "$response" | jq -r ".result[$i].callback_query.data // empty")"
            callback_chat="$(echo "$response" | jq -r ".result[$i].callback_query.message.chat.id // empty")"
            callback_from="$(echo "$response" | jq -r ".result[$i].callback_query.from.username // .result[$i].callback_query.from.id // \"telegram\"")"
            if [ -n "$callback_id" ] && [ -n "$callback_data" ] && [ "$callback_chat" = "$TELEGRAM_CHAT_ID" ]; then
              callbacks="$(echo "$callbacks" | jq --arg id "$callback_id" --arg data "$callback_data" --arg actor "$callback_from" '. + [{id:$id,data:$data,actor:$actor}]')"
            fi
          done

          if [ -n "$max_update_id" ]; then
            ack_ok="$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=$((max_update_id + 1))" | jq -r '.ok // false')"
            if [ "$ack_ok" != "true" ]; then
              echo "::warning::Telegram offset ack failed; not dispatching."
              exit 0
            fi
          fi

          callback_count="$(echo "$callbacks" | jq 'length')"
          for ((i=0; i<callback_count; i++)); do
            callback_id="$(echo "$callbacks" | jq -r ".[$i].id")"
            callback_data="$(echo "$callbacks" | jq -r ".[$i].data")"
            actor="$(echo "$callbacks" | jq -r ".[$i].actor")"
            decision="$(printf '%s' "$callback_data" | cut -d: -f2)"
            review_id="$(printf '%s' "$callback_data" | cut -d: -f3)"

            if [ "$decision" = "approve" ] && [ -n "$review_id" ]; then
              answer="Use webhook mode for Charon approvals; polling mode cannot recover the reviewed skill."
            elif [ "$decision" = "reject" ] && [ -n "$review_id" ]; then
              answer="Charon rejected. No run dispatched."
            elif [ "$decision" = "inspect" ] && [ -n "$review_id" ]; then
              answer="Review: $review_id"
            else
              answer="Unknown Charon action."
            fi
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
              -d "callback_query_id=${callback_id}" \
              --data-urlencode "text=${answer}" >/dev/null || true
          done

          msg_count="$(echo "$messages" | jq 'length')"
          echo "Found $msg_count Telegram message(s)."
          for ((i=0; i<msg_count; i++)); do
            text="$(echo "$messages" | jq -r ".[$i]")"
            gh workflow run messages.yml -R "$GITHUB_REPOSITORY" -f source=telegram -f message="$text"
          done

  run:
    if: github.event_name == 'workflow_dispatch' && inputs.message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Classify message
        id: msg
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          message="$INPUT_MESSAGE"
          source="${INPUT_SOURCE:-telegram}"
          actor="${{ github.actor }}"
          lower="$(printf '%s' "$message" | tr '[:upper:]' '[:lower:]')"

          skill="digest"
          if printf '%s' "$lower" | grep -Eq '\b(code health|code-health|repo health)\b'; then
            skill="code-health"
          elif printf '%s' "$lower" | grep -Eq '\b(repo scanner|repo-scanner|scan repo)\b'; then
            skill="repo-scanner"
          elif printf '%s' "$lower" | grep -Eq '\b(repo pulse|repo-pulse|github monitor|github-monitor)\b'; then
            skill="repo-pulse"
          elif printf '%s' "$lower" | grep -Eq '\b(github trending|github-trending|trending repos)\b'; then
            skill="github-trending"
          elif printf '%s' "$lower" | grep -Eq '\b(hn digest|hn-digest|hacker news)\b'; then
            skill="hn-digest"
          elif printf '%s' "$lower" | grep -Eq '\b(mcp pulse|mcp-pulse)\b'; then
            skill="mcp-pulse"
          elif printf '%s' "$lower" | grep -Eq '\b(framework watch|framework-watch|agent framework)\b'; then
            skill="framework-watch"
          elif printf '%s' "$lower" | grep -Eq '\b(security digest|security-digest|security news|mcp security)\b'; then
            skill="security-digest"
          elif printf '%s' "$lower" | grep -Eq '\b(priority brief|priority-brief)\b'; then
            skill="priority-brief"
          elif printf '%s' "$lower" | grep -Eq '\b(changelog|change log)\b'; then
            skill="changelog"
          elif printf '%s' "$lower" | grep -Eq '\b(cost report|cost-report|spend report)\b'; then
            skill="cost-report"
          elif printf '%s' "$lower" | grep -Eq '\b(repo actions|repo-actions)\b'; then
            skill="repo-actions"
          elif printf '%s' "$lower" | grep -Eq '\b(issue triage|issue-triage|triage issues)\b'; then
            skill="issue-triage"
          elif printf '%s' "$lower" | grep -Eq '\b(review pr|pr review|comment on pr)\b'; then
            skill="pr-review"
          elif printf '%s' "$lower" | grep -Eq '\b(deploy|prototype|vercel)\b'; then
            skill="deploy-prototype"
          elif printf '%s' "$lower" | grep -Eq '\b(workflow audit|audit workflow|github actions audit)\b'; then
            skill="workflow-audit"
          fi

          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$message" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Charon message preflight
        id: charon
        env:
          MESSAGE: ${{ steps.msg.outputs.message }}
          SOURCE: ${{ steps.msg.outputs.source }}
          ACTOR: ${{ steps.msg.outputs.actor }}
          SKILL: ${{ steps.msg.outputs.skill }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx -y github:CharonAI-code/charon aeon preflight \
            --skill "$SKILL" \
            --var "$MESSAGE" \
            --trigger "$SOURCE-message" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --actor "$ACTOR" \
            --policy charon.aeon.yml \
            --review > charon-preflight.json
          status=$?
          set -e

          verdict="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("charon-preflight.json","utf8")); console.log(j.verdict || "")')"
          reason="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("charon-preflight.json","utf8")); console.log(j.reason || "")')"
          rule_id="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("charon-preflight.json","utf8")); console.log(j.ruleId || "")')"

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "### Charon preflight"
            echo ""
            echo "- skill: \`$SKILL\`"
            echo "- verdict: \`$verdict\`"
            echo "- rule: \`$rule_id\`"
            echo "- reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" = "PAUSE" ]; then
            npx -y github:CharonAI-code/charon aeon telegram send latest
            exit "$status"
          fi

          if [ "$verdict" = "DENY" ]; then
            npx -y github:CharonAI-code/charon aeon telegram send --preflight charon-preflight.json
            exit "$status"
          fi

          cat charon-preflight.json | jq '{verdict, reason, ruleId, launched, reviewId}'

      - name: Run AEON message
        if: steps.charon.outputs.verdict == 'PASS'
        env:
          MESSAGE: ${{ steps.msg.outputs.message }}
          SKILL_NAME: ${{ steps.msg.outputs.skill }}
          GH_TOKEN: ${{ secrets.GH_GLOBAL || github.token }}
        run: |
          set -euo pipefail
          gh workflow run aeon.yml -R "$GITHUB_REPOSITORY" \
            -f skill="$SKILL_NAME" \
            -f var="$MESSAGE"
          echo "Dispatched aeon.yml skill=$SKILL_NAME"
